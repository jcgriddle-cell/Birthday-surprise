
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Debut Invitation</title>
    <link rel="stylesheet" href="fourthpage.css">
</head>
<body>

    <section class="gallery-page">
        <div class="background-flower flower-one">✿</div>
        <div class="background-flower flower-two">❀</div>

        <div class="gallery-container">
            <p class="small-title">A COLLECTION OF MEMORIES</p>
            <h1>Photo Gallery</h1>
            <p class="subtitle">
                A little glimpse of beautiful moments and memories.
            </p>

            <div class="gallery-grid">
                <div class="photo-card">
                    <img src="photo1.jpg" alt="Gallery photo 1">
                    <p>Beautiful Moments</p>
                </div>

                <div class="photo-card">
                    <img src="photo2.jpg" alt="Gallery photo 2">
                    <p>Sweet Memories</p>
                </div>

                <div class="photo-card">
                    <img src="photo3.jpg" alt="Gallery photo 3">
                    <p>Little Things</p>
                </div>

                <div class="photo-card">
                    <img src="photo4.jpg" alt="Gallery photo 4">
                    <p>Special Days</p>
                </div>

                <div class="photo-card">
                    <img src="photo5.jpg" alt="Gallery photo 5">
                    <p>Happy Moments</p>
                </div>

                <div class="photo-card">
                    <img src="photo6.jpg" alt="Gallery photo 6">
                    <p>Memories to Keep</p>
                </div>
            </div>

            <div class="gallery-buttons">
                <button id="backButton">← Back</button>
                <p>With love, always ♡</p>
                <button id="nextButton">Next →</button>
            </div>
        </div>
    </section>

    <!-- Image preview -->
    <div class="image-preview" id="imagePreview">
        <button id="closePreview" aria-label="Close image">×</button>
        <img id="previewImage" src="" alt="Enlarged gallery photo">
    </div>

    <script src="fourthpage.js"></script>
</body>
</html>
